<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeStorming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app">
    <div id="toolbar">
      <button id="view-toggle" class="btn">Switch to Editor (Ctrl+M)</button>
      <button id="download-btn" class="btn" style="display: none;">Download</button>
      <button id="copy-btn" class="btn" style="display: none;">Copy to Clipboard</button>
    </div>

    <div id="canvas-container">
      <canvas id="graph-canvas"></canvas>

      <!-- Node Creation/Edit Form -->
      <div id="node-form" class="floating-form" style="display: none;">
        <input type="text" id="node-title-input" placeholder="Node Title" class="form-input title-input">
        <textarea id="node-body-input" placeholder="Description/Body" class="form-input body-input"></textarea>
        <input type="text" id="node-rel-input" placeholder="Relationship Label (optional)" class="form-input rel-input">
      </div>

      <!-- Relationship Edit Form -->
      <div id="rel-form" class="floating-form" style="display: none;">
        <input type="text" id="rel-label-input" placeholder="Relationship Label" class="form-input rel-input">
      </div>

      <!-- Spotlight Search Overlay -->
      <div id="spotlight-overlay" style="display: none;">
        <div class="spotlight-container">
          <input type="text" id="spotlight-input" placeholder="Search nodes..." autocomplete="off">
          <ul id="spotlight-results"></ul>
        </div>
      </div>
    </div>

    <div id="editor-container">
      <textarea id="markdown-editor" spellcheck="false"></textarea>
    </div>

    <div id="toast">Copied to clipboard!</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeStorming — Markdown Mind Storming</title>
  <meta name="description"
    content="TypeStorming: Markdown-first visual mind storming. Turn plain text into interactive node-and-edge graphs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app">
    <div id="toolbar">
      <span id="mode-indicator" class="mode-badge">SELECT</span>
      <button id="view-toggle" class="btn">Switch to Editor (Ctrl+M)</button>
      <button id="download-btn" class="btn" style="display: none;">Download</button>
      <button id="copy-btn" class="btn" style="display: none;">Copy to Clipboard</button>
    </div>

    <div id="canvas-container">
      <!-- SVG is created dynamically by the Renderer -->

      <!-- Spotlight Search Overlay -->
      <div id="spotlight-overlay" style="display: none;">
        <div class="spotlight-container">
          <input type="text" id="spotlight-input" placeholder="Search nodes..." autocomplete="off">
          <ul id="spotlight-results"></ul>
        </div>
      </div>
    </div>

    <div id="editor-container">
      <textarea id="markdown-editor" spellcheck="false"></textarea>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <!-- Keyboard shortcut legend (bottom-left) -->
    <div id="shortcut-legend">
      <div class="legend-row"><kbd>Enter</kbd> New Sibling</div>
      <div class="legend-row"><kbd>Tab</kbd> Create Child</div>
      <div class="legend-row"><kbd>Space</kbd> Edit Node</div>
      <div class="legend-row"><kbd>-</kbd> Link to Node</div>
      <div class="legend-row"><kbd>Ctrl+K</kbd> Search</div>
      <div class="legend-row"><kbd>Ctrl+Z</kbd> Undo</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
